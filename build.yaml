# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command and `artifact-name` to assign a name to
# distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     cmake-args: -DCONFIG_ZMK_USB_LOGGING=y
#     artifact-name: corne_left_with_logging
#
---
include:
 # 右手（親）は名前だけ変えて台数分作る。
 #   CONFIG_BT_DEVICE_NAME    … Bluetooth の一覧に出る名前（16バイトまで。漢字は1文字3バイト）
 #   CONFIG_ZMK_KEYBOARD_NAME … USB の製品名・ZMK Studio に出る名前（英数字にしておく）
 # ZMK の CI は cmake-args をシェルにそのまま渡すので、文字列の引用符は \" と書く。
 # 初号機（F4:33:68:1E:3A:D1）→ roBa_R_1.uf2
 - board: seeeduino_xiao_ble
   shield: roBa_R
   snippet: studio-rpc-usb-uart
   cmake-args: -DCONFIG_ZMK_KEYBOARD_NAME=\"roBa-1\" -DCONFIG_BT_DEVICE_NAME=\"初号機\"
   artifact-name: roBa_R_1
 # 弐号機（C5:CF:7A:57:2D:ED）→ roBa_R_2.uf2
 - board: seeeduino_xiao_ble
   shield: roBa_R
   snippet: studio-rpc-usb-uart
   cmake-args: -DCONFIG_ZMK_KEYBOARD_NAME=\"roBa-2\" -DCONFIG_BT_DEVICE_NAME=\"弐号機\"
   artifact-name: roBa_R_2
 # 参号機（購入予定）→ roBa_R_3.uf2
 - board: seeeduino_xiao_ble
   shield: roBa_R
   snippet: studio-rpc-usb-uart
   cmake-args: -DCONFIG_ZMK_KEYBOARD_NAME=\"roBa-3\" -DCONFIG_BT_DEVICE_NAME=\"参号機\"
   artifact-name: roBa_R_3
 - board: seeeduino_xiao_ble
   shield: roBa_L
 - board: seeeduino_xiao_ble
   shield: settings_reset
